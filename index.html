    <!--
      MÀN MỞ ĐẦU TĨNH — kiểu dáng nội tuyến, cố ý.

      Bản trước dựng màn mở đầu bằng React (src/components/Curtain.tsx). Nó không
      bao giờ chạy: App.tsx không hề import nó. Và kể cả có import thì vẫn muộn —
      một component React chỉ vẽ được sau khi chunk JS về, parse xong và mount,
      tức là sau đúng cái khoảng trắng mà màn mở đầu sinh ra để che.

      Ở đây kiểu dáng nằm thẳng trong <head> và khối markup nằm thẳng trong
      <body>, nên trình duyệt vẽ nó ngay lúc parse xong HTML — trước chunk JS,
      trước cả chunk CSS của Tailwind. Nền đặt trên <html> để không có một khung
      hình trắng nào lọt vào trước khi màn kịp vẽ.
    -->
    <style>
      html {
        background: #050b13;
      }
      body {
        margin: 0;
        background: #050b13;
      }
      #curtain {
        position: fixed;
        inset: 0;
        z-index: 95;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050b13;
        transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      }
      /*
        Trạng thái "đã sẵn sàng" đặt trên <html> chứ không phải trên chính tấm
        màn: script nội tuyến bật cờ này được mà không cần tìm phần tử, nên nó
        chạy đúng cả khi màn đã bị gỡ khỏi cây.
      */
      :root[data-ready="1"] #curtain {
        opacity: 0;
        pointer-events: none;
      }
      #curtain .mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: curtain-rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #curtain svg {
        width: 44px;
        height: 44px;
        color: #dfc27d;
      }
      #curtain .word {
        margin-top: 16px;
        font: 700 15px/1 Georgia, "Times New Roman", serif;
        letter-spacing: 0.3em;
        /* Lùi 0.3em để khoảng cách chữ cuối không đẩy khối lệch sang trái. */
        text-indent: 0.3em;
        color: #eef4fa;
      }
      #curtain .rule {
        margin-top: 16px;
        width: 96px;
        height: 1px;
        background: linear-gradient(90deg, transparent, #dfc27d, transparent);
        transform: scaleX(0);
        animation: curtain-rule 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes curtain-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      @keyframes curtain-rule {
        to {
          transform: scaleX(1);
        }
      }
      /*
        Giảm chuyển động: màn vẫn còn — nó che khoảng trắng, đó là việc của nó —
        nhưng bỏ hẳn phần diễn: không nhấc chữ, không kéo đường kẻ, và nhấc màn
        gần như tức thì thay vì mờ dần.
      */
      @media (prefers-reduced-motion: reduce) {
        #curtain,
        #curtain .mark,
        #curtain .rule {
          animation: none;
          transition-duration: 0.01s;
        }
        #curtain .rule {
          transform: none;
        }
      }
      noscript .fallback {
        position: relative;
        z-index: 96;
        display: block;
        max-width: 42rem;
        margin: 0 auto;
        padding: 6rem 1.5rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        color: #eef4fa;
      }
      noscript .fallback a {
        color: #dfc27d;
      }
    </style>
    <script>
      /*
        Nhấc màn. Gọi từ src/main.tsx ngay sau khi React vẽ xong khung hình đầu.

        Có đường lui bốn giây vì tấm màn tuyệt đối không được phép thành cái bẫy:
        chunk JS hỏng, mạng đứt giữa chừng hay một lỗi lúc mount đều không được
        để khách hàng ngồi trước một màn hình đen vĩnh viễn. Hết bốn giây là nhấc,
        bất kể React đã tới đâu.
      */
      (function () {
        var root = document.documentElement;
        var failsafe = window.setTimeout(lift, 4000);

        function lift() {
          window.clearTimeout(failsafe);
          if (root.dataset.ready === "1") return;
          root.dataset.ready = "1";
          var el = document.getElementById("curtain");
          if (!el) return;
          // Gỡ hẳn sau khi mờ xong: một lớp phủ trong suốt còn nằm đó vẫn ăn
          // mất sự kiện chuột của cả trang.
          window.setTimeout(function () {
            el.remove();
          }, 900);
        }

        window.__lhptLiftCurtain = lift;
      })();
    </script>
